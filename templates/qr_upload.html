<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scan to Simulate Drone Upload</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body
    style="
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Lexend', sans-serif;
      background-color: #f9fff4;
      color: #2f4f1f;
      text-align: center;
      margin: 0;
      padding: 20px;
    "
  >
    <div
      class="qr-section"
      style="
        background-color: white;
        padding: 2rem;
        border-radius: 12px;
        border: 3px solid #4d7c0f;
        box-shadow: 0 6px 16px rgba(77, 124, 15, 0.15);
        max-width: 500px;
        width: 90%;
        display: flex;
        flex-direction: column;
        align-items: center;
      "
    >
      <h2
        style="
          font-size: 1.5rem;
          font-weight: 600;
          margin-bottom: 1rem;
          color: #4d7c0f;
        "
      >
        Simulated Drone Upload
      </h2>
      <p style="font-size: 0.95rem; color: #5a7550; margin-bottom: 1.2rem">
        Scan this QR code with your phone to simulate a drone capturing and
        uploading a field photo.
      </p>
      <div
        class="qr-code-container"
        style="
          padding: 12px;
          border: 2px solid #4d7c0f;
          border-radius: 8px;
          background-color: #f0f8e8;
          margin-bottom: 1rem;
          display: flex;
          justify-content: center;
          align-items: center;
        "
      >
        <img
          src="data:image/png;base64,{{ qr_code }}"
          alt="QR Code"
          style="width: 300px; height: 300px; display: block"
        />
      </div>
    </div>
    <button
      class="get-started-btn"
      style="
        position: relative;
        margin-top: 50px;
        padding: 15px 40px;
        font-size: 2rem;
        font-family: 'Lexend', sans-serif;
        font-weight: bold;
        background-color: #4d8a3d;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        letter-spacing: 3px;
        transition: all 0.3s ease;
        z-index: 3;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      "
      id="get-started-btn"
    >
      Analyze Drone Imagery
    </button>
  </body>

  <script>
    // Add event listener to the form submission
    const getStartedBtn = document.getElementById("get-started-btn");
    getStartedBtn.addEventListener("click", function () {
      // Link to the QR code page (qr_upload.html)
      window.location.href = "/upload-success";
    });
    document.addEventListener("DOMContentLoaded", function () {
      const uploadForm = document.querySelector('form[action="/upload"]');
      if (uploadForm) {
        uploadForm.addEventListener("submit", function (event) {
          event.preventDefault();

          const fileInput = uploadForm.querySelector('input[type="file"]');
          if (!fileInput.files || fileInput.files.length === 0) {
            alert("Please select a file to upload");
            return;
          }

          const formData = new FormData();
          formData.append("file", fileInput.files[0]);

          fetch("/upload", {
            method: "POST",
            body: formData,
          })
            .then((response) => {
              if (!response.ok) throw new Error("Upload failed");
              return response.json();
            })
            .then(() => {
              window.location.href = "/upload-success";
            })
            .catch((error) => {
              console.error("Upload error:", error);
              alert("There was a problem uploading your file.");
            });
        });
      }
    });

    function checkForNewImages() {
      fetch("/check-for-new-image")
        .then((res) => res.json())
        .then((data) => {
          if (data.image_url) {
            const img = document.getElementById("latest-field-image");
            const timestamp = new Date().getTime();
            if (img && !img.src.includes(data.image_url.split("?")[0])) {
              img.src = data.image_url + "?t=" + timestamp;
              img.alt = "Latest Field Image";
            }
          }
        })
        .catch((err) => console.error("Error checking for new images:", err));
    }

    setInterval(checkForNewImages, 2000);
  </script>
</html>
