<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Photo Upload</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>QR Photo Upload</h1>

      <div class="qr-section">
        <h2>Scan this QR code with your phone</h2>
        <div class="qr-code">
          <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code" />
        </div>
        <p>Scan to open the upload page on your phone</p>
      </div>

      <div class="image-section">
        <h2>Latest Uploaded Photo</h2>
        <div id="latest-image-container">
          {% if latest_image %}
          <img src="{{ latest_image }}" alt="Latest uploaded photo" />
          {% else %}
          <p>
            No photo uploaded yet. Scan the QR code with your phone to upload a
            photo.
          </p>
          {% endif %}
        </div>
      </div>
    </div>

    <script>
      // Add event listener to the form submission
      document.addEventListener("DOMContentLoaded", function () {
        const uploadForm = document.querySelector('form[action="/upload"]');
        if (uploadForm) {
          uploadForm.addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent default form submission

            // Get the file input
            const fileInput = uploadForm.querySelector('input[type="file"]');
            if (!fileInput.files || fileInput.files.length === 0) {
              alert("Please select a file to upload");
              return;
            }

            // Create FormData object
            const formData = new FormData();
            formData.append("file", fileInput.files[0]);

            // Submit form data via fetch API
            fetch("/upload", {
              method: "POST",
              body: formData,
            })
              .then((response) => {
                if (!response.ok) {
                  throw new Error("Network response was not ok");
                }
                return response.json();
              })
              .then((data) => {
                // If upload was successful, redirect to upload_success page
                window.location.href = "/upload-success";
              })
              .catch((error) => {
                console.error("Error uploading file:", error);
                alert(
                  "There was a problem uploading your file. Please try again."
                );
              });
          });
        }
      });

      // This function still checks for new images on the current page
      // and will run until the redirect happens
      function checkForNewImages() {
        fetch("/check-for-new-image")
          .then((response) => response.json())
          .then((data) => {
            if (data.image_url) {
              const container =
                document.getElementById("latest-field-image").parentNode;
              // Add a timestamp to the URL to prevent caching
              const timestamp = new Date().getTime();
              const imageUrl = data.image_url + "?t=" + timestamp;

              // Check if there's already an image and it's different
              const existingImg = document.getElementById("latest-field-image");
              if (
                !existingImg ||
                !existingImg.src.includes(data.image_url.split("?")[0])
              ) {
                // Update the image source
                existingImg.src = imageUrl;
                existingImg.alt = "Latest Field Image";
              }
            }
          })
          .catch((error) =>
            console.error("Error checking for new images:", error)
          );
      }

      // Start checking for new images
      setInterval(checkForNewImages, 2000);
    </script>
  </body>
</html>
