<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Farm Welcome Page</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #f3f7df;
        font-family: "Lexend", sans-serif;
        font-size: 98px;
        display: flex;
        letter-spacing: 15px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        overflow: hidden;
      }
      .welcome-container {
        position: relative;
        text-align: center;
        margin-bottom: -250px;
        width: 100%;
      }
      .welcome-text {
        font-size: 12rem;
        font-family: "Lexend", sans-serif;
        font-weight: bold;
        color: #4d8a3d;
        letter-spacing: 10px;
        display: flex;
        justify-content: center;
        position: relative;
        opacity: 1;
        transition: opacity 0.6s ease, transform 0.6s ease;
      }
      .fade-out {
        opacity: 0;
        transform: scale(0.95);
      }
      .fade-in {
        opacity: 1;
        transform: scale(1);
      }
      .farm-image {
        width: 750px;
        max-width: 90%;
        height: auto;
        position: fixed;
        transform: none !important;
        border-radius: 10px;
        z-index: 2;
        position: relative;
      }
      .get-started-btn {
        position: relative;
        margin-top: 50px;
        padding: 15px 40px;
        font-size: 2rem;
        font-family: "Lexend", sans-serif;
        font-weight: bold;
        background-color: #4d8a3d;
        color: white;
        border: none;
        border-radius: 50px;
        cursor: pointer;
        letter-spacing: 3px;
        transition: all 0.3s ease;
        z-index: 3;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      }
      .get-started-btn:hover {
        background-color: #3c6a30;
        transform: translateY(-5px);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
      }
      .get-started-btn:active {
        transform: translateY(-2px);
        box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
      }
    </style>
  </head>
  <body>
    <div class="welcome-container">
      <div class="welcome-text" id="welcome-text">WELCOME</div>
    </div>
    <img
      src="static/images/welcome_drone.png"
      alt="Farm Scene"
      class="farm-image"
    />
    <button class="get-started-btn" id="get-started-btn">GET STARTED</button>

    <script>
      const words = [
        "WELCOME", // English
        "स्वागत", // Hindi
        "CIAO", // Italian
        "BONJOUR", // French
        "欢迎", // Chinese (Simplified)
        "ようこそ", // Japanese
        "HALLO", // German
        "환영합니다", // Korean
        "أهلا بك", // Arabic
      ];

      let index = 0;
      const welcomeText = document.getElementById("welcome-text");
      const getStartedBtn = document.getElementById("get-started-btn");

      // Make language changes faster (2 seconds instead of 3.35 seconds)
      setInterval(() => {
        welcomeText.classList.remove("fade-in");
        welcomeText.classList.add("fade-out");

        setTimeout(() => {
          index = (index + 1) % words.length;
          welcomeText.textContent = words[index];

          welcomeText.classList.remove("fade-out");
          welcomeText.classList.add("fade-in");
        }, 700); // Faster fade transition (600ms instead of 1000ms)
      }, 2500); // Faster interval (2 seconds instead of 3.35 seconds)

      // Add event listener for the Get Started button
      getStartedBtn.addEventListener("click", function () {
        // Link to the QR code page (qr_upload.html)
        window.location.href = "/qr_upload";
      });
    </script>
  </body>
</html>
